name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Revisar estructura del proyecto
        run: |
          echo "Directorio actual:"
          pwd
          echo "Archivos de la raíz:"
          ls -la
          echo "Archivos de configuración:"
          find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "build.gradle.kts" -o -name "gradle-wrapper.properties" \) -print

      - name: Verificar Gradle
        run: gradle --version

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Automix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
